<!doctype html><meta charset="utf-8"><title>개인정보처리방침 - 경제한컵 스튜디오</title>
<h1>개인정보처리방침</h1>
<p>경제한컵 스튜디오는 채널 운영자 본인만 사용하는 도구입니다.</p>
<ul>
<li>구글 계정 연결은 운영자 본인의 유튜브 채널에 영상을 올리는 데에만 씁니다.</li>
<li>연결 정보는 운영자 본인의 컴퓨터에만 저장하며, 다른 곳으로 보내거나 제3자와 공유하지 않습니다.</li>
<li>다른 사람의 개인정보를 모으지 않습니다.</li>
</ul>
<p>연결을 끊으려면 구글 계정 설정의 '타사 앱 및 서비스'에서 이 앱의 접근 권한을 삭제하면 됩니다.</p>
